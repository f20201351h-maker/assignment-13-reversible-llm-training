[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revllm"
version = "0.1.0"
description = "Auditable 20M-parameter reversible language model experiments"
requires-python = ">=3.10,<3.15"
dependencies = [
  "torch>=2.10,<2.15",
  "numpy>=1.26,<3",
  "datasets>=3,<6",
  "huggingface_hub>=0.25,<2",
  "tokenizers>=0.20,<1",
  "pyarrow>=18,<26",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]
report = ["Markdown>=3.7,<4", "reportlab>=4.2,<5"]

[project.scripts]
revllm = "revllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
